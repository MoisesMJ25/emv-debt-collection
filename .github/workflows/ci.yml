name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # deploy.yml lo reutiliza antes de desplegar

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  python:
    name: lint, tipos, tests y wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (formato)
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest + cobertura
        run: pytest --cov-report=xml

      - name: Build del wheel
        run: python -m build --wheel --outdir dist

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  bundle:
    name: databricks bundle validate
    runs-on: ubuntu-24.04
    env:
      # `bundle validate` necesita autenticarse contra un workspace (credenciales de dev a nivel de repositorio).
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Valores ficticios: solo se valida la estructura, no se despliega nada.
      BUNDLE_VAR_existing_cluster_id: "0000-000000-ci000000"
      BUNDLE_VAR_service_principal_application_id: "00000000-0000-0000-0000-000000000000"
      BUNDLE_VAR_failure_notification_email: "ci@example.test"
      BUNDLE_VAR_api_base_url: "https://backoffice.example.test"
      BUNDLE_VAR_api_key_scope: "ci-scope"
      BUNDLE_VAR_api_key_name: "ci-key"
      BUNDLE_VAR_mongo_connection: "ci-connection"
      BUNDLE_VAR_mongo_secret: "ci-secret"
      BUNDLE_VAR_source_table: "ci_catalog.ci_schema.ci_debts"
      BUNDLE_VAR_tables_schema: "ci_catalog.ci_schema"
      BUNDLE_VAR_operator_user: "ci@example.test"
      BUNDLE_VAR_logs_dir: "/Volumes/ci_catalog/ci_schema/ci_volume/logs"
      BUNDLE_VAR_email_recipients: "ci@example.test"
      BUNDLE_VAR_teams_chat_id: "ci-chat"
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::warning::Sin secretos de Databricks (p. ej. PR desde un fork): se omite bundle validate."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: databricks/setup-cli@v1.18.0
        if: steps.creds.outputs.available == 'true'

      - name: Validar target dev
        if: steps.creds.outputs.available == 'true'
        run: databricks bundle validate -t dev

      - name: Validar target prod
        if: steps.creds.outputs.available == 'true'
        run: databricks bundle validate -t prod

  terraform:
    name: terraform fmt y validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
